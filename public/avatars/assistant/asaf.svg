    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b271c"/>
      <stop offset="100%" stop-color="#1e130d"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- Shoulders / modern crew-neck t-shirt -->
  <path d="M40 256 C44 202, 82 184, 128 184 C174 184, 212 202, 216 256 Z" fill="url(#shirt)"/>
  <path d="M104 186 Q128 206 152 186" fill="none" stroke="#065f46" stroke-width="5" stroke-linecap="round"/>
